<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400" fill="none">
  <defs>
    <linearGradient id="top" x1="0.1" y1="0.1" x2="0.95" y2="0.9">
      <stop offset="0" stop-color="#ffd27a"/><stop offset="0.45" stop-color="#ff9a3c"/><stop offset="1" stop-color="#ee5a3a"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0485f"/><stop offset="1" stop-color="#c3213f"/>
    </linearGradient>
    <linearGradient id="low" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#b01c3c"/><stop offset="1" stop-color="#7d1233"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb066"/><stop offset="1" stop-color="#9c1a3b"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3.2" stdDeviation="2.6" flood-color="#2a0a1e" flood-opacity="0.38"/>
    </filter>
  </defs>
  <g filter="url(#soft)" transform="rotate(-6 50 50)">
    <!-- rounded body: a thick rounded outline gives the clay-like volume of the 3dicons set -->
    <path d="M91 12 L9 43 L39 57 L51 88 Z" fill="url(#rim)" stroke="url(#rim)" stroke-width="7" stroke-linejoin="round"/>
    <!-- facets -->
    <path d="M89.5 13.5 L13 42.5 L38 54 Z" fill="url(#top)" stroke="url(#top)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M89.5 13.5 L38 54 L58 66 Z" fill="url(#mid)" stroke="url(#mid)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M40.5 57.5 L51 85 L58 66 Z" fill="url(#low)" stroke="url(#low)" stroke-width="3" stroke-linejoin="round"/>
    <!-- fold crease + soft inner shade -->
    <path d="M89.5 13.5 L38 54" stroke="#7d1233" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round"/>
    <!-- specular highlight on the lit wing -->
    <path d="M80 18 L26 40 L40 38 Z" fill="url(#gloss)"/>
    <path d="M21 41.5 L34 36.5" stroke="#fff" stroke-opacity="0.75" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
